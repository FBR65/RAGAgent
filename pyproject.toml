[project]
name = "ragagent"
version = "0.1.0"
description = "Agentic RAG System with Ollama integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "nltk>=3.8.0",
    "tiktoken>=0.5.0",
    "python-multipart>=0.0.6",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "gradio==5.34.0",
    "qdrant-client>=1.7.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
ragagent = "ragagent.cli:main"
